<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Seneca Syndicate mark: top-down twin-engine aircraft -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1A312C"/>
  <!-- main wing -->
  <rect x="6" y="27" width="52" height="8" rx="4" fill="#FFF4E1"/>
  <!-- fuselage -->
  <rect x="28" y="9" width="8" height="46" rx="4" fill="#FFF4E1"/>
  <!-- horizontal stabilizer -->
  <rect x="21" y="46" width="22" height="6" rx="3" fill="#FFF4E1"/>
  <!-- two engine nacelles (the "twin") -->
  <rect x="15" y="22" width="7" height="18" rx="3.5" fill="#428475"/>
  <rect x="42" y="22" width="7" height="18" rx="3.5" fill="#428475"/>
  <!-- canopy -->
  <circle cx="32" cy="19" r="3.2" fill="#89D7B7"/>
</svg>
